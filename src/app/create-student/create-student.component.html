<header class="page-header">
  <h1 class="header-title">Create Student</h1>
</header>

<main class="container">
  <section class="panel">
    <form (ngSubmit)="createStudent()">
      <div class="form-grid">
        <label>
          Student ID
          <input [(ngModel)]="form.studentId" name="studentId" />
        </label>

        <label>
          Email
          <input [(ngModel)]="form.email" name="email" type="email" />
        </label>

        <label>
          First Name
          <input [(ngModel)]="form.firstName" name="firstName" />
        </label>

        <label>
          Age
          <input [(ngModel)]="form.age" name="age" type="number" />
        </label>

        <label>
          Last Name
          <input [(ngModel)]="form.lastName" name="lastName" />
        </label>

        <label>
          GPA
          <input [(ngModel)]="form.gpa" name="gpa" />
        </label>

        <label class="span-2">
          Enrollment Status
          <input [(ngModel)]="form.status" name="status" />
        </label>
      </div>

      <div class="actions">
        <button type="button" class="btn" (click)="back()">Back</button>
        <button type="submit" class="btn primary">Create student</button>
      </div>
    </form>
  </section>
</main>
