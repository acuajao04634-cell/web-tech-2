<header class="page-header">
  <h1 class="header-title">Student Management</h1>
  <a class="btn primary" routerLink="/create-student">Add Student</a>
</header>

<main class="container">
  <section class="panel">
    <h2 class="panel-title">Students</h2>

    <div class="cards">
      <article class="card" *ngFor="let s of students; let i = index">
        <div>
          <h3 class="student-name">{{ s.name }}</h3>
          <p class="meta">{{ s.course }}</p>
          <p class="meta">{{ s.yearLevel }}</p>
        </div>

        <button class="btn danger" (click)="deleteStudent(i)">
          Delete
        </button>
      </article>
    </div>
  </section>
</main>
